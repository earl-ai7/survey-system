<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PST Pastil Survey Recorder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Survey">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header>
  <h1>Customer Satisfaction Survey</h1>
  <p>PST Pastil &middot; ACLC Baliuag research</p>
</header>

<nav>
  <button class="tab active" data-tab="record">Record Survey</button>
  <button class="tab" data-tab="records">Records</button>
  <button id="installBtn" type="button" hidden>Install app</button>
</nav>

<main>
  <section id="record" class="panel">
    <div class="card">
      <h2>Scan surveys</h2>
      <p id="camMsg" class="msg err"></p>
      <p id="autoStatus" class="msg"></p>
      <div id="camBox" hidden>
        <div class="vwrap"><video id="vid" autoplay playsinline muted></video><canvas id="ov"></canvas><div class="guide"></div></div>
        <p id="liveStatus" class="msg"></p>
        <div class="row">
          <button id="snap" class="shutter" type="button" aria-label="Capture" title="Capture"></button>
        </div>
      </div>
      <div id="tools" hidden>
        <div class="canvas-wrap"><canvas id="cv"></canvas></div>
      </div>
    </div>

    <div class="card" id="resultsCard">
      <h2>Live results: how many voted 1 to 5</h2>
      <p id="rcount" class="muted"></p>
      <div class="table-wrap"><table id="res"></table></div>
      <div class="row"><button id="manualBtn" type="button">Enter answers manually</button></div>
    </div>

    <div class="card" id="ansCard" hidden>
      <h2>Answers (check unclear rows or type manually)</h2>
      <div class="row">
        <input id="name" type="text" placeholder="Name (optional)">
        <input id="date" type="date">
      </div>
      <div class="table-wrap">
        <table id="answers">
          <thead><tr><th>#</th><th>Statement</th><th>5<br><small>Strongly Agree</small></th><th>4<br><small>Agree</small></th><th>3<br><small>Neutral</small></th><th>2<br><small>Disagree</small></th><th>1<br><small>Strongly Disagree</small></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <button id="save" class="primary" type="button">Save Response</button>
      <p id="msg" class="msg"></p>
    </div>
  </section>

  <section id="records" class="panel" hidden>
    <div class="card">
      <h2>Saved Responses</h2>
      <p id="count" class="muted"></p>
      <div class="row">
        <button id="refresh" type="button">Refresh</button>
        <button id="csv" type="button">Download CSV</button>
      </div>
      <div class="table-wrap"><table id="list"></table></div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3>&#9888; Survey not recorded</h3>
    <p id="modalText"></p>
    <div class="row">
      <button id="modalFix" class="primary" type="button">Fix answers</button>
      <button id="modalClose" type="button">Close</button>
    </div>
  </div>
</div>

<script src="js/grid.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
let installEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; document.getElementById('installBtn').hidden = false; });
document.getElementById('installBtn').onclick = async () => {
  if (!installEv) return; installEv.prompt(); await installEv.userChoice; installEv = null; document.getElementById('installBtn').hidden = true;
};
window.addEventListener('appinstalled', () => { document.getElementById('installBtn').hidden = true; });
</script>
</body>
</html>
